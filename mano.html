<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3a4de0">
  <title>Mano lankomumas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="styles.css">
  <style>
    .me { max-width: 860px; margin: 0 auto; padding: 18px 16px 48px; }
    .me-top { display: flex !important; flex-direction: row !important; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .me-top .mt-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; }
    .me-top .right { display: flex; align-items: center; gap: 8px; }
    .who-row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .who-row .lead { margin: 4px 0 0; }
    .big-av { width: 68px; height: 68px; border-radius: 20px; object-fit: cover; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.4rem; background: var(--grad); box-shadow: var(--shadow); }
    .me h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: -0.03em; font-weight: 800; }
    .me .lead { margin: 4px 0 20px; color: var(--muted); }
    .hero { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
    .ring { position: relative; width: 150px; height: 150px; }
    .ring svg { transform: rotate(-90deg); }
    .ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 2.1rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .ring .num small { display: block; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; }
    .tile b { display: block; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: var(--c); line-height: 1.1; }
    .tile span { font-size: 0.74rem; color: var(--muted); font-weight: 600; }
    .alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--a) 40%, transparent); background: color-mix(in srgb, var(--a) 10%, var(--surface)); }
    .alert b { color: var(--a); }
    .alert p { margin: 2px 0 0; font-size: 0.9rem; }
    .okbox { border-color: color-mix(in srgb, var(--p) 40%, transparent); background: color-mix(in srgb, var(--p) 10%, var(--surface)); }
    .okbox b { color: var(--p); }
    .list { display: grid; gap: 8px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
    .row .d { min-width: 74px; font-weight: 700; font-size: 0.88rem; }
    .row .t { flex: 1; min-width: 0; font-size: 0.9rem; }
    .row .t small { display: block; color: var(--muted); }
    .st { font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); white-space: nowrap; }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin: 0 0 12px; cursor: pointer; }
    .toggle input { width: 18px; height: 18px; padding: 0; accent-color: var(--brand); }
    @media (max-width: 560px) { .hero { grid-template-columns: 1fr; justify-items: center; } .tiles { width: 100%; } .ring { width: 140px; height: 140px; } .ring .num { font-size: 1.9rem; } .me table th, .me table td { padding-left: 6px; padding-right: 6px; } .row .d { min-width: 64px; } }
  </style>
</head>
<body>
  <div class="me" id="root"><p class="muted" style="padding:24px">Kraunama…</p></div>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('attendance-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}

      var root = document.getElementById('root');
      var ST = { P: ['Dalyvavo', 'var(--p)'], A: ['Nedalyvavo', 'var(--a)'], L: ['Vėlavo', 'var(--l)'], E: ['Pateisinta', 'var(--e)'] };
      var onlyIssues = true;
      var data = null;
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      var dateLt = function (iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('lt-LT', { month: 'short', day: 'numeric' }); };
      var dateLong = function (iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('lt-LT', { weekday: 'long', month: 'long', day: 'numeric' }); };
      var rateCls = function (r) { return r == null ? 'na' : r >= 90 ? 'good' : r >= 80 ? 'mid' : 'low'; };
      var rateCol = function (r) { return r == null ? 'var(--muted)' : r >= 90 ? 'var(--p)' : r >= 80 ? 'var(--l)' : 'var(--a)'; };

      function ring(rate) {
        var R = 62, C = 2 * Math.PI * R, v = rate == null ? 0 : rate / 100;
        return '<div class="ring"><svg width="100%" height="100%" viewBox="0 0 150 150" aria-hidden="true">' +
          '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="12"/>' +
          '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="' + rateCol(rate) + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (C * v).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
          '<div class="num"><div>' + (rate == null ? '–' : rate + '%') + '<small>lankomumas</small></div></div></div>';
      }

      function draw() {
        var d = data, t = d.total;
        var h = '<div class="me-top"><div class="mt-brand"><span class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Lankomumas</div>' +
          '<div class="right"><button class="btn small" id="logout">Atsijungti</button></div></div>';
        var ini = d.name.split(' ').filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
        var av = d.photo ? '<img class="big-av" src="/api/photo?id=' + encodeURIComponent(d.id) + '&v=' + d.photo + '" alt="" onerror="this.outerHTML=\'<span class=big-av aria-hidden=true>' + esc(ini) + '</span>\'">' : '<span class="big-av" aria-hidden="true">' + esc(ini) + '</span>';
        h += '<div class="who-row">' + av + '<div><h1>Sveiki, ' + esc(d.name.split(' ')[0] || 'mokiny') + '</h1><p class="lead">' + esc(d.name) + (d.grade ? ' · ' + esc(d.grade) + ' kl.' : '') + ' · ' + esc(dateLong(d.today)) + '</p></div></div>';

        if (d.risk.low || d.risk.streak) {
          var msg = [];
          if (d.risk.low) msg.push('Jūsų lankomumas (' + t.rate + '%) yra žemiau ' + d.risk.limit + '%.');
          if (d.risk.streak) msg.push('Paskutinės ' + d.risk.streak + ' dienos iš eilės pažymėtos kaip nedalyvavote.');
          h += '<div class="alert" role="alert"><span aria-hidden="true">⚠️</span><div><b>Reikia dėmesio</b><p>' + msg.join(' ') + ' Jei kuri nors diena pažymėta klaidingai, pasakykite tarybos vadovui.</p></div></div>';
        } else if (t.rate != null) {
          h += '<div class="alert okbox"><span aria-hidden="true">✅</span><div><b>Viskas gerai</b><p>Jūsų lankomumas yra tvarkingas. Taip ir toliau!</p></div></div>';
        }

        h += '<div class="card"><div class="hero">' + ring(t.rate) + '<div class="tiles">' +
          ['P', 'L', 'A', 'E'].map(function (k) { return '<div class="tile" style="--c:' + ST[k][1] + '"><b>' + t[k] + '</b><span>' + ST[k][0] + '</span></div>'; }).join('') +
          '</div></div></div>';

        h += '<div class="card"><h2>Mano komitetai</h2>' + (d.committees.length ? '<div class="table-wrap"><table><thead><tr><th>Komitetas</th><th class="num">Dalyv.</th><th class="num">Vėl.</th><th class="num">Nedal.</th><th class="num">Rodiklis</th></tr></thead><tbody>' +
          d.committees.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td class="num">' + c.P + '</td><td class="num">' + c.L + '</td><td class="num">' + c.A + '</td><td class="num"><span class="rate ' + rateCls(c.rate) + '">' + (c.rate == null ? '–' : c.rate + '%') + '</span></td></tr>'; }).join('') +
          '</tbody></table></div>' : '<p class="muted">Jūs dar nepriskirtas jokiam komitetui.</p>') +
          '<p class="sub" style="margin:12px 0 0;font-size:.8rem">Pateisintos dienos į rodiklį neįskaičiuojamos.</p></div>';

        if (d.upcoming.length) {
          h += '<div class="card"><h2>Artimiausios veiklos</h2><div class="list">' + d.upcoming.map(function (u) {
            return '<div class="row"><span class="d">' + esc(dateLt(u.d)) + '</span><span class="t"><b>' + esc(u.name) + '</b><small>' + esc(u.com) + (u.from ? ' · ' + esc(u.from) + (u.to ? '–' + esc(u.to) : '') : '') + (u.place ? ' · ' + esc(u.place) : '') + '</small></span></div>';
          }).join('') + '</div></div>';
        }

        var hist = d.history.filter(function (x) { return !onlyIssues || x.s !== 'P'; });
        h += '<div class="card"><h2>Istorija</h2><label class="toggle"><input type="checkbox" id="onlyIssues" ' + (onlyIssues ? 'checked' : '') + '> Rodyti tik praleidimus, vėlavimus ir pateisinimus</label>' +
          (hist.length ? '<div class="list">' + hist.slice(0, 40).map(function (x) {
            var by = x.by ? '<small>Pažymėjo: ' + esc(x.by) + (x.at ? ' · ' + esc(new Date(x.at).toLocaleDateString('lt-LT', { month: 'short', day: 'numeric' })) : '') + '</small>' : '';
            return '<div class="row"><span class="d">' + esc(dateLt(x.d)) + '</span><span class="t">' + esc(x.c) + (x.a ? '<small>' + esc(x.a) + '</small>' : '') + by + '</span><span class="st" style="--c:' + ST[x.s][1] + '">' + ST[x.s][0] + '</span></div>';
          }).join('') + '</div>' : '<p class="muted" style="margin:0">' + (onlyIssues ? 'Praleidimų nėra. Puiku!' : 'Įrašų dar nėra.') + '</p>') +
          '</div>';
        h += '<p class="muted" style="text-align:center;font-size:.78rem">Matote tik savo duomenis. Klaidas pranešykite tarybos administratoriui.</p>';
        root.innerHTML = h;
        document.getElementById('logout').onclick = logout;
        var c = document.getElementById('onlyIssues');
        if (c) c.onchange = function () { onlyIssues = c.checked; draw(); };
      }

      function logout() {
        fetch('/api/student', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'logout' }) })
          .catch(function () {}).then(function () { location.href = '/'; });
      }

      fetch('/api/student', { credentials: 'same-origin' }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (!x.ok) throw new Error(x.j.error || 'Klaida');
          if (!x.j.student) { location.replace('/'); return; }
          data = x.j.student; draw();
        })
        .catch(function (e) {
          root.innerHTML = '<div class="card empty"><h2>Nepavyko įkelti duomenų</h2><p>' + esc(e.message) + '</p><a class="btn primary" href="/">Grįžti</a></div>';
        });
    })();
  </script>
</body>
</html>
