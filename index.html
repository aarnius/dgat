<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a4de0">
  <title>Lankomumo žurnalas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lankomumas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Šriftas kraunamas nesustabdant puslapio atvaizdavimo -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="content" id="app"></main>
  </div>

  <dialog id="studentDialog">
    <form method="dialog" id="studentForm" class="dlg">
      <div class="dlg-head"><h3 id="studentDialogTitle">Mokinys</h3><button type="button" class="icon-btn" data-act="close-dialog" aria-label="Uždaryti">&times;</button></div>
      <input type="hidden" name="id">
      <div class="grid2">
        <label>Vardas<input name="first" required></label>
        <label>Pavardė<input name="last"></label>
      </div>
      <label>Klasė<input name="grade" list="gradeList" placeholder="pvz. 7A" autocomplete="off"></label><datalist id="gradeList"></datalist>
      <fieldset class="classpick" id="comPick"></fieldset>
      <label>El. paštas<input name="email" type="email"></label>
      <label>Tėvų / globėjų el. paštas<input name="parentEmail" type="email"></label>
      <label>Pastabos<textarea name="notes" rows="3"></textarea></label>
      <div class="dlg-actions">
        <button type="button" class="btn" data-act="close-dialog">Atšaukti</button>
        <button type="submit" class="btn primary">Išsaugoti mokinį</button>
      </div>
    </form>
  </dialog>

  <dialog id="importDialog"></dialog>
  <dialog id="cardDialog"></dialog>
  <div id="toast" aria-live="polite"></div>
  <div id="saveStatus" class="save-status" aria-live="polite" hidden></div>
  <div id="printFooter" class="print-footer"></div>

  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="sync.js"></script>
  <script src="log.js"></script>
  <script src="activities.js"></script>
  <script src="tools.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
  <script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
